<style>
/* Layout: a large atlas sheet in an oak frame with a parchment dossier beside it; the atlas carries terrain, the overlay carries the game. Single dark theme. */
:root{
  --oak:#12100d; --brass:#b08a4a; --brass-hi:#e6c98a;
  --parch:#efe2c2; --parch-2:#dcc89c; --parch-ink:#33261a; --parch-mute:#75603f;
  --wax:#9e2a22; --text:#efe4cc; --muted:#b6a789;
  --f-title:"Cormorant SC","Cormorant Garamond",Georgia,serif; --f-serif:"Cormorant Garamond",Georgia,serif; --f-ui:"Alegreya Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--oak);color:var(--text);font-family:var(--f-ui);font-size:16px;line-height:1.5;
  }
.wrap{max-width:1500px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 56px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:14px}
h1{margin:0;font-family:var(--f-title);font-weight:700;font-size:clamp(30px,4.4vw,54px);line-height:1;color:var(--brass-hi);text-shadow:0 2px 0 #000}
.sub{margin:6px 0 0;font-family:var(--f-serif);font-style:italic;font-weight:600;font-size:19px;color:var(--muted)}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tbtn{font:inherit;font-weight:700;font-size:14px;padding:7px 12px;border-radius:4px;border:1px solid var(--brass);background:#2e2116;color:var(--text);cursor:pointer}
.tbtn[aria-pressed="true"]{background:var(--brass);color:#1a110a}
.page{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.frame{position:relative;padding:12px;border-radius:6px;background:linear-gradient(135deg,#5a3f27,#3a2818 40%,#4f3622 70%,#2e2015);box-shadow:inset 0 0 0 2px #1a110a,inset 0 0 0 4px var(--brass),inset 0 0 0 6px #1a110a,0 18px 40px rgba(0,0,0,.6)}
.mapscroll{overflow:auto;border-radius:2px;max-height:82vh}
.stage{position:relative;width:100%;min-width:820px;aspect-ratio:1586/992;background:#1d3a4a;transition:width .2s}
.stage.zoom{width:200%}
.stage img.map,.stage svg{position:absolute;inset:0;width:100%;height:100%;display:block}
#ov .hit{cursor:pointer}
#ov .hit .node{transform-box:fill-box;transform-origin:center;transition:transform .12s}
#ov .hit:hover .node,#ov .hit:focus-visible .node{transform:scale(1.15)}
#ov .hit:focus{outline:none}
#ov.nogame .game,#ov.nogame .fog{display:none}
.fog{pointer-events:none}
.loading{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-serif);font-style:italic;font-size:22px;color:var(--parch);background:#2a3d48}
.dossier{background:var(--parch);color:var(--parch-ink);border-radius:4px;box-shadow:inset 0 0 40px rgba(120,80,30,.35),0 0 0 2px #1a110a,0 0 0 5px var(--brass),0 16px 34px rgba(0,0,0,.55);overflow:hidden}
.dossier .hd{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;padding:16px 18px 12px;border-bottom:2px solid rgba(117,96,63,.4)}
.dossier .hd svg{width:52px;height:62px}
.dossier .hd small{display:block;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--parch-mute)}
.dossier .hd b{display:block;font-family:var(--f-title);font-weight:700;font-size:25px;line-height:1.05}
.dossier .bd{padding:14px 18px 18px;display:grid;gap:12px}
.dossier .bd p{margin:0}
.quote{font-family:var(--f-serif);font-style:italic;font-weight:600;font-size:19px;line-height:1.35;border-left:3px solid var(--wax);padding-left:12px}
.ql{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.ql li{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:start;font-size:14.5px;line-height:1.3}
.ql .n{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;font-weight:800;font-size:12px;color:#3a2a12;background:radial-gradient(circle at 35% 30%,#f2dca2,#b8904a 70%);box-shadow:0 0 0 2px #5a4020}
.ql li.now .n{background:radial-gradient(circle at 35% 30%,#ffe9a8,#e0a838 70%);box-shadow:0 0 0 2px #5a4020,0 0 0 5px rgba(224,168,56,.45)}
.ql li.done .n{background:radial-gradient(circle at 35% 30%,#b8d68a,#5f7a34 70%);color:#fff}
.ql li.lock .n{filter:grayscale(.7) brightness(.85)}
.ql b{display:block;font-family:var(--f-serif);font-size:18px;font-weight:700}
.ql span span{color:var(--parch-mute);font-size:13.5px}
.boss{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;padding:10px 12px;border-radius:4px;background:rgba(158,42,34,.1);border:1px solid rgba(158,42,34,.45)}
.boss svg{width:44px;height:54px}
.boss b{display:block;font-family:var(--f-title);font-size:19px;color:var(--wax)}
.boss span{font-size:14px}
.lock{font-style:italic;font-family:var(--f-serif);font-weight:600;font-size:17px;color:var(--parch-mute);border-top:1px dashed var(--parch-mute);border-bottom:1px dashed var(--parch-mute);padding:6px 0}
.hint{margin-top:12px;color:var(--muted);font-size:14px}
:focus-visible{outline:3px solid var(--brass-hi);outline-offset:2px}
@media (max-width:1060px){.page{grid-template-columns:minmax(0,1fr)}.mapscroll{max-height:none}}
@media (prefers-reduced-motion:reduce){#ov .hit .node,.stage{transition:none}}

.mebox{display:flex;align-items:center;gap:8px;margin-right:6px}.mebox img{width:34px;height:34px;border-radius:50%;object-fit:cover;object-position:50% 15%;border:1.5px solid #c9a45c}
.mebox span{display:flex;flex-direction:column;line-height:1.1}.mebox small{font-size:12px;opacity:.75}a.tbtn{text-decoration:none;display:inline-flex;align-items:center}
.go{display:block;text-align:center;margin:14px 0 4px;padding:12px 16px;border-radius:4px;background:linear-gradient(#e9c77e,#b8873e);color:#24170c;font-weight:700;text-decoration:none;border:1px solid #6e4d22;font-size:17px}
.go:hover{filter:brightness(1.08)}

.stage canvas#fx{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
#ov .fogHit{cursor:help;outline:none}
.tip{position:absolute;z-index:3;pointer-events:none;max-width:240px;padding:8px 11px;border-radius:4px;background:rgba(239,226,194,.96);color:#33261a;font-size:14px;line-height:1.3;box-shadow:0 0 0 1px #6e4d22,0 6px 16px rgba(0,0,0,.45)}
.tip b{display:block;font-family:var(--f-title);font-size:18px;line-height:1.1}
.tip i{font-family:var(--f-serif);font-weight:600;color:#75603f}
#tokIn{animation:bob 2.6s ease-in-out infinite alternate;transform-box:fill-box}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-5px)}}
#ov .pop{opacity:0}
#ov .popin{animation:popin .7s cubic-bezier(.3,1.6,.5,1) both;transform-box:fill-box;transform-origin:50% 100%}
@keyframes popin{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){#tokIn,#ov .popin{animation:none}#ov .pop{opacity:1}}
</style>

  src.forEach(function(s){var x=s[0],y=s[1],path=[[x,y]],ups=0,ok=false;
    for(var st=0;st<700;st++){var e=at(elev,x,y);if(e<=0){ok=true;break;}var best=e,bx=x,by=y;
      for(var a=0;a<16;a++){var an=a/16*Math.PI*2,nx=x+Math.cos(an)*5,ny=y+Math.sin(an)*5,ne=at(elev,nx,ny)+(fbm(nx*.05,ny*.05,2)-.5)*.004;if(ne<best){best=ne;bx=nx;by=ny;}}
      if(bx===x&&by===y){if(ups++>40)break;var an2=rnd(st+x)*Math.PI*2;bx=x+Math.cos(an2)*6;by=y+Math.sin(an2)*6;}
      x=bx;y=by;path.push([x,y]);
      for(var r=0;r<rivers.length;r++){var R=rivers[r];for(var q=0;q<R.length;q+=3){if(Math.hypot(R[q][0]-x,R[q][1]-y)<5){ok=true;st=1e9;break;}}if(st>1e8)break;}}
